---
- name: Install iptables
  ansible.builtin.apt:
    name: iptables
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Allow established and related traffic
  ansible.builtin.iptables:
    chain: INPUT
    ctstate:
      - ESTABLISHED
      - RELATED
    jump: ACCEPT

- name: Allow loopback traffic
  ansible.builtin.iptables:
    chain: INPUT
    in_interface: lo
    jump: ACCEPT

- name: Allow SSH to vm1
  ansible.builtin.iptables:
    chain: INPUT
    protocol: tcp
    destination_port: "22"
    jump: ACCEPT
  when: inventory_hostname == "vm1"

- name: Allow SSH from vm1 to vm2/vm3
  ansible.builtin.iptables:
    chain: INPUT
    protocol: tcp
    source: 172.20.0.10/32
    destination_port: "22"
    jump: ACCEPT
  when: inventory_hostname in ["vm2", "vm3"]

- name: Allow HTTP from Docker network
  ansible.builtin.iptables:
    chain: INPUT
    protocol: tcp
    source: 172.20.0.0/24
    destination_port: "80"
    jump: ACCEPT

- name: Allow HTTPS from Docker network
  ansible.builtin.iptables:
    chain: INPUT
    protocol: tcp
    source: 172.20.0.0/24
    destination_port: "443"
    jump: ACCEPT

- name: Allow ICMP from Docker network
  ansible.builtin.iptables:
    chain: INPUT
    protocol: icmp
    source: 172.20.0.0/24
    jump: ACCEPT

- name: Set default INPUT policy to DROP
  ansible.builtin.iptables:
    chain: INPUT
    policy: DROP
